[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.flake8]
max-line-length = 100
exclude = ["__pycache__", "venv", "env"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["telegram_dir_watcher"]

[tool.coverage.report]
fail_under = 80
show_missing = true
